<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crónica</title>
<style>
  /* El vídeo es un diario: cada hito, una primera plana; el arranque y el cierre, el noticiario. */
  @font-face { font-family: "Newsreader"; src: url(fonts/Newsreader.ttf) format("truetype"); font-weight: 200 800; font-style: normal; }
  @font-face { font-family: "Newsreader"; src: url(fonts/Newsreader-Italic.ttf) format("truetype"); font-weight: 200 800; font-style: italic; }
  @font-face { font-family: "UnifrakturMaguntia"; src: url(fonts/UnifrakturMaguntia.ttf) format("truetype"); }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 400 700; }
  :root {
    --papel: #ede6d6; --papel-2: #d9d0bc; --tinta: #191612; --gastada: #5a5247; --sello: #b3301c;
    --sala: #12100d; --sello-sala: #e0533b; --papel-sala: #c9bfaa;
    --mono: "IBM Plex Mono", ui-monospace, monospace; --serif: "Newsreader", Georgia, serif;
    --gotica: "UnifrakturMaguntia", "Old English Text MT", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--serif); }
  #stage { position: absolute; inset: 0; }
  em { font-style: italic; font-weight: 600; }

  /* La cabecera del diario. */
  #cabecera { position: absolute; left: 64px; right: 64px; top: 26px; }
  #cabecera .fila { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 24px; padding-bottom: 10px; }
  #mancheta { justify-self: start; width: max-content; font: 54px/1 var(--gotica); white-space: nowrap; }
  #fecha, #chip { font: 500 18px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; padding-bottom: 6px; white-space: nowrap; }
  #chip { justify-self: end; }
  .filete { height: 4px; background: var(--tinta); }
  .filete.fino { height: 1px; margin-top: 3px; }

  #antetitulo { position: absolute; left: 64px; top: 116px; height: 24px; display: flex; align-items: center; gap: 14px;
    font: 500 17px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; transform-origin: 0 50%; }
  #antetitulo b { font-weight: 600; padding: 4px 8px; background: var(--tinta); color: var(--papel); letter-spacing: .16em; }
  #antetitulo.cambia b { background: transparent; color: var(--tinta); border: 1px solid var(--tinta); }
  #rotulo { position: absolute; left: 64px; top: 152px; padding-top: 4px; font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -.02em;
    white-space: nowrap; }

  /* La foto de portada: la app tal como se veía. */
  #browser { position: absolute; left: 64px; top: 236px; width: 1280px; height: 720px; overflow: hidden; background: #fff;
    border: 1px solid var(--tinta); transform-origin: 50% 50%; }
  #shot { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #fff; }
  #shot img { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #pie { position: absolute; left: 64px; top: 966px; width: 1280px; display: flex; gap: 18px; align-items: baseline; }
  #url { font: 500 14px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: var(--gastada); }
  #nota { font-style: italic; font-size: 25px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* El sello: fecha, número y commit, de un golpe al entrar cada escena. */
  #sello { position: absolute; left: 1150px; top: 54px; width: 190px; height: 190px; pointer-events: none; transform-origin: 50% 50%; }

  /* La columna: en cifras y la hemeroteca. */
  #lado { position: absolute; left: 1392px; top: 236px; width: 464px; }
  .seccion { font-weight: 800; font-size: 30px; line-height: 1; padding-bottom: 8px; border-bottom: 3px solid var(--tinta); }
  .cifra { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; height: 58px; padding-top: 6px; border-bottom: 1px solid var(--tinta); }
  .cifra .n { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .cifra .l { font: 500 13px/1 var(--mono); color: var(--gastada); letter-spacing: .14em; text-transform: uppercase; }
  #lado .hem { margin-top: 22px; }
  #mosaic { position: absolute; left: 1392px; top: 560px; width: 464px; height: 440px; }
  .tile { position: absolute; overflow: hidden; background: var(--papel-2); border: 1px solid var(--gastada); }
  .tile img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); }
  .tile.cubre img { left: 0; top: 0; transform: none; }
  .tile .light { opacity: 0; }
  .tile b { position: absolute; left: 0; bottom: 0; max-width: 100%; padding: 2px 6px; font: 500 11px/1.3 var(--mono);
    background: var(--papel); color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* La tira: las fechas de todos los números, con el de hoy encendido. */
  #tl { position: absolute; left: 0; right: 0; top: 1018px; height: 62px; background: var(--tinta); }
  #tl .fill { position: absolute; left: 0; top: 0; height: 3px; background: var(--sello-sala); }
  #tl .dot { position: absolute; top: 22px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
    border: 2px solid var(--gastada); }
  #tl .dot.on { border-color: var(--sello-sala); box-shadow: inset 0 0 0 3px var(--tinta), inset 0 0 0 9px var(--sello-sala); }
  #tl .ext { position: absolute; left: 230px; right: 230px; top: 0; bottom: 0; }
  #tl .fechas { position: absolute; left: 64px; right: 64px; top: 0; bottom: 0; display: flex; justify-content: space-between;
    align-items: center; font: 500 14px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--papel-sala); pointer-events: none; }

  /* La extracción, a dos columnas de periódico. */
  #ext { position: absolute; inset: 0; background: var(--papel); display: none; overflow: hidden; }
  #ext .repo { position: absolute; top: 50px; width: 420px; height: 520px; border-top: 4px solid var(--tinta); padding: 18px 0 0; }
  #ext .repo h3 { font: 500 22px var(--mono); color: var(--tinta); }
  #ext .repo .n { margin-top: 14px; font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #ext .repo .l { font: 500 13px var(--mono); color: var(--gastada); letter-spacing: .14em; text-transform: uppercase; }
  #ext .repo ul { list-style: none; padding: 0; margin-top: 22px; }
  #ext .repo li { font: 15px var(--mono); color: var(--gastada); padding: 6px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--papel-2);
    display: flex; justify-content: space-between; }
  #ext .repo li.va { background: var(--tinta); color: var(--papel); }
  #ext .vuela { position: absolute; font: 14px var(--mono); color: var(--tinta); white-space: nowrap; padding: 4px 10px;
    background: var(--papel); border: 1px solid var(--tinta); }
  #ext .pie { position: absolute; left: 0; right: 0; top: 610px; text-align: center; font-style: italic; font-size: 28px; color: var(--tinta); }
  #ext .pie b { font-style: normal; font-weight: 800; }
  #ext .flecha { position: absolute; left: 540px; top: 320px; width: 280px; height: 2px; background: var(--tinta); }
  #ext .flecha::after { content: ""; position: absolute; right: -2px; top: -7px; border: 8px solid transparent; border-left: 14px solid var(--tinta); border-right: 0; }

  /* El noticiario: entrada y cierre en sala oscura, con la película a los lados. */
  .card { position: absolute; inset: 0; background: var(--sala); color: var(--papel); overflow: hidden; }
  .card .perf { position: absolute; top: 0; width: 72px; height: 1080px; background-color: #0a0907;
    background-image: repeating-linear-gradient(180deg, transparent 0 22px, var(--papel) 22px 50px, transparent 50px 72px);
    background-size: 30px 72px; background-repeat: repeat-y; background-position: center 0; }
  .card .perf.izq { left: 0; } .card .perf.der { right: 0; }
  #introbg { position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; background-size: cover; background-position: center;
    filter: grayscale(1) contrast(1.2) brightness(.17) blur(3px); }
  .card .cuerpo { position: absolute; left: 300px; right: 300px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .card .ante { display: flex; align-items: center; gap: 22px; font: 500 24px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; }
  .card .ante .g { font: 54px/1 var(--gotica); letter-spacing: 0; text-transform: none; }
  .card .ante i { width: 64px; height: 2px; background: var(--papel); }
  .card h1 { margin-top: 26px; font-weight: 800; font-size: 220px; line-height: .88; letter-spacing: -.03em; white-space: nowrap; }
  .card .raya { margin-top: 34px; height: 2px; width: 100%; background: var(--papel); }
  .card p { margin-top: 22px; font-style: italic; font-size: 44px; line-height: 1.2; }
  .card .sub { margin-top: 24px; display: flex; gap: 40px; font: 500 22px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--papel-sala); }
  #outro h1 { font-size: 132px; line-height: .92; white-space: normal; }
  .card .big { display: flex; gap: 0; margin-top: 6px; }
  .card .big div { flex: 1; padding: 20px 20px 0 0; border-right: 1px solid var(--gastada); font: 500 16px var(--mono); letter-spacing: .16em;
    text-transform: uppercase; color: var(--papel-sala); }
  .card .big div + div { padding-left: 20px; }
  .card .big div:last-child { border-right: 0; }
  .card .big strong { display: block; font: 800 76px/1 var(--serif); letter-spacing: 0; color: var(--papel); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  #fin { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; align-items: center; gap: 36px; }
  #fin i { width: 240px; height: 1px; background: var(--gastada); }
  #fin span { font: 72px/1 var(--gotica); }
  #outro p.peq { margin-top: 14px; font-size: 26px; color: var(--papel-sala); }
  /* El cartel de un acto: abre cada parte del vídeo en la sala, con su número, su título y una frase. */
  #acto { opacity: 0; }
  #acto h1 { font-size: 150px; white-space: nowrap; }
  #acto p.frase { margin-top: 30px; font-size: 46px; max-width: 1320px; }
  #ext .dato { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font: 500 15px var(--mono);
    letter-spacing: .14em; text-transform: uppercase; color: var(--gastada); }
</style>
</head>
<body>
<div id="stage">
  <div id="cabecera">
    <div class="fila"><div id="mancheta"></div><div id="fecha"></div><div id="chip"></div></div>
    <div class="filete"></div><div class="filete fino"></div>
  </div>
  <div id="antetitulo"><b></b><em></em></div>
  <div id="rotulo"></div>
  <div id="browser"><div id="shot"><img id="a" alt=""><img id="b" alt=""><div id="ext"></div></div></div>
  <div id="pie"><span id="url"></span><span id="nota"><span></span></span></div>
  <svg id="sello" viewBox="0 0 240 240" aria-hidden="true">
    <defs>
      <filter id="tinta" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="r"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="r" scale="3.2"></feDisplacementMap>
      </filter>
      <path id="arco" d="M 40 120 A 80 80 0 0 1 200 120"></path>
      <path id="arco2" d="M 36 128 A 84 84 0 0 0 204 128"></path>
    </defs>
    <g filter="url(#tinta)" fill="none" stroke="#b3301c" opacity=".92">
      <circle cx="120" cy="120" r="110" stroke-width="5"></circle>
      <circle cx="120" cy="120" r="100" stroke-width="1.6"></circle>
      <circle cx="120" cy="120" r="62" stroke-width="1.6"></circle>
      <text fill="#b3301c" stroke="none" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" letter-spacing="5"><textPath href="#arco" startOffset="50%" text-anchor="middle">CRÓNICA</textPath></text>
      <text fill="#b3301c" stroke="none" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="3"><textPath href="#arco2" startOffset="50%" text-anchor="middle" id="sello-num"></textPath></text>
      <text id="sello-dia" x="120" y="118" fill="#b3301c" stroke="none" text-anchor="middle" font-family="Newsreader, serif" font-weight="800" font-size="44"></text>
      <text id="sello-ano" x="120" y="148" fill="#b3301c" stroke="none" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="4"></text>
    </g>
  </svg>
  <div id="lado"></div>
  <div id="mosaic"></div>
  <div id="tl"><div class="fill"></div><div class="ext"></div><div class="fechas"><span id="tl-a"></span><span id="tl-b"></span></div></div>
  <div class="card" id="intro"><div id="introbg"></div><div class="perf izq"></div><div class="perf der"></div>
    <div class="cuerpo">
      <div class="ante"><span class="g">Crónica</span><i></i><span id="noticiario"></span></div>
      <h1 id="introh"></h1><div class="raya"></div><p id="introsub"></p><div class="sub" id="introdatos"></div>
    </div></div>
  <div class="card" id="acto"><div class="perf izq"></div><div class="perf der"></div>
    <div class="cuerpo">
      <div class="ante"><span class="g">Crónica</span><i></i><span id="acton"></span></div>
      <h1 id="actoh"></h1><div class="raya"></div><p class="frase" id="actof"></p>
    </div></div>
  <div class="card" id="outro"><div class="perf izq"></div><div class="perf der"></div>
    <div class="cuerpo">
      <div class="ante" id="outroante"></div>
      <h1 id="outroh"></h1><div class="raya"></div><div class="big" id="outrobig"></div><p id="outrosub"></p><p class="peq" id="outropie"></p>
    </div>
    <div id="fin"><i></i><span id="fint"></span><i></i></div></div>
</div>
<script>
const TRANS = 380
const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const lerp = (a, b, k) => a + (b - a) * k
/** Una palabra del vídeo en el idioma de datos.json, con sus huecos ({i}, {n}…) rellenos. */
const tr = (k, v = {}) => (D.t?.[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '')
const num = n => Math.round(n).toLocaleString(D?.locale || 'es-ES')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
/** Reduce la letra hasta que el texto quepa en `ancho`. */
function encajar (el, ancho) {
  el.style.fontSize = ''
  let px = parseFloat(getComputedStyle(el).fontSize)
  while (el.scrollWidth > ancho && px > 20) { px -= 2; el.style.fontSize = `${px}px` }
}
const fotograma = (h, f) => `${h.clip}${String(clamp(f, 0, h.fotogramas - 1)).padStart(4, '0')}.jpg`
/** Un giro distinto para cada golpe de sello, siempre el mismo para la misma escena. */
const giro = i => [-9, 7, -13, 4, -6, 11, -3, 9][i % 8]

let D, H = [], CIFRAS = [], ORDER = [], FIRST = {}, LATEST = [], FIN = 0
window.duration = 0

async function load () {
  D = await (await fetch('datos.json')).json()
  H = D.hitos; CIFRAS = D.cifras
  // El capítulo (repositorio) de cada escena: una extracción sigue en el del anterior.
  H.forEach((h, i) => { h.capitulo = h.cap ?? (i ? H[i - 1].capitulo : 0) })
  H.forEach((h, i) => h.fichas.forEach(t => { if (!(t.key in FIRST)) { FIRST[t.key] = i; ORDER.push(t.key) } }))
  // La foto más reciente de cada ficha en cada escena (las escenas sin fichas heredan las de la anterior).
  LATEST = []
  H.forEach((h, i) => { const m = { ...(LATEST[i - 1] || {}) }; h.fichas.forEach(t => { m[t.key] = t }); LATEST.push(m) })
  FIN = H.at(-1).inicio + H.at(-1).dur
  window.duration = FIN + D.outro
  const fichas = new Set(H.flatMap(h => h.fichas.flatMap(t => [t.light, t.dark].filter(Boolean))))
  await Promise.all([...fichas].map(src => new Promise(ok => { const im = new Image(); im.onload = im.onerror = ok; im.src = src })))
  // Las letras se cargan al usarse: se piden antes de medir nada.
  await Promise.all(['800 64px Newsreader', '800 150px Newsreader', 'italic 600 25px Newsreader', '54px UnifrakturMaguntia', '18px "IBM Plex Mono"']
    .map(f => document.fonts.load(f).catch(() => {})))
  const mosaic = $('mosaic')
  for (const key of ORDER) {
    const el = document.createElement('div'); el.className = 'tile'; el.dataset.key = key
    el.innerHTML = '<img class="dark" alt=""><img class="light" alt=""><b></b>'
    const ultima = LATEST.at(-1)[key]
    el.querySelector('b').textContent = ultima?.nombre ?? key.split('/').pop()
    if (ultima?.cubre) el.classList.add('cubre')
    mosaic.appendChild(el)
  }
  const tl = $('tl').querySelector('.ext')
  H.forEach(h => { const d = document.createElement('div'); d.className = 'dot'; d.style.left = `${(h.inicio + h.dur) / FIN * 100}%`; tl.appendChild(d) })
  $('noticiario').textContent = tr('Noticiario del proyecto'); $('fint').textContent = tr('Fin')
  $('lado').innerHTML = `<div class="seccion">${tr('En cifras')}</div>` +
    CIFRAS.map(([k, l]) => `<div class="cifra"><div class="n" data-k="${k}">0</div><div class="l">${l}</div></div>`).join('') +
    `<div class="seccion hem">${tr('Hemeroteca')}</div>`
  // La hemeroteca empieza justo debajo de la última cifra.
  const hem = $('lado').querySelector('.hem')
  const top = 236 + hem.offsetTop + hem.offsetHeight + 14
  MOS.y = top; MOS.h = 1000 - top
  const last = H.at(-1)
  $('mancheta').textContent = tr('Crónica de {p}', { p: D.proyecto })
  encajar($('mancheta'), 640)
  $('tl-a').textContent = H[0].fecha_corta; $('tl-b').textContent = last.fecha_corta
  $('introh').textContent = D.titulo
  $('introsub').textContent = D.rango
  // La demo en vivo no cuenta como número del diario: es la edición en directo del final.
  const numeros = H.filter(h => !h.demo).length
  $('introdatos').innerHTML = `<span>${tr(numeros === 1 ? '{n} número' : '{n} números', { n: numeros })}</span>` +
    CIFRAS.filter(([k]) => last.cifras[k]).slice(0, 2).map(([k, l]) => `<span>${num(last.cifras[k])} ${esc(l)}</span>`).join('')
  const primera = H.find(h => h.fotogramas)
  if (primera) $('introbg').style.backgroundImage = `url(${fotograma(primera, 0)})`
  $('outroante').innerHTML = `<span>${esc(tr('Última edición'))} · ${esc(D.final)}</span>`
  $('outroh').innerHTML = esc(tr('{lapso} de {p}', { lapso: D.lapso, p: '\u0000' })).replace('\u0000', `<em>${esc(D.proyecto)}</em>`)
  $('outrosub').textContent = D.cierre || ''
  $('outropie').textContent = D.pie || ''
  const ROMANOS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X']
  H.filter(h => h.acto).forEach((h, j) => { h.acto.num = `${tr('Acto')} ${ROMANOS[j] ?? j + 1}` })
  $('outrobig').innerHTML = CIFRAS.filter(([k]) => last.cifras[k]).map(([k, l]) => `<div><strong>${num(last.cifras[k])}</strong>${l}</div>`).join('')
  encajar($('introh'), 1320)
  window.ready = true
}
const MOS = { x: 1392, y: 560, w: 464, h: 440 }

/** Rejilla para n fichas en un panel W x Hh: las columnas que mejor lo llenan. */
function grid (n, W, Hh, gap = 8) {
  if (!n) return []
  let best = null
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols)
    const w = (W - gap * (cols - 1)) / cols, h = (Hh - gap * (rows - 1)) / rows
    const size = Math.min(w, h * 1.5)
    if (!best || size > best.size) best = { cols, w, h: Math.min(h, w / 1.1), size }
  }
  return Array.from({ length: n }, (_, j) => ({
    x: (j % best.cols) * (best.w + gap), y: Math.floor(j / best.cols) * (best.h + gap), w: best.w, h: best.h
  }))
}

function poner (img, src) {
  if (img.dataset.src === src) return null
  img.dataset.src = src; img.src = src
  return img.decode().catch(() => {})
}

/** Pinta el instante t (ms). Devuelve una promesa que se cumple cuando los fotogramas del clip están pintados. */
function seek (t) {
  const N = H.length, outroT = t - FIN
  let i = H.findIndex(h => t < h.inicio + h.dur)
  if (i < 0) i = N - 1
  const h = H[i], prev = H[i - 1]
  // Con cartel de acto, la escena arranca cuando el cartel se va: hasta entonces se queda en su instante 0.
  const pre = h.pre || 0, enActo = t - h.inicio
  const local = Math.max(0, enActo - pre)
  const k = ease(local / TRANS)
  const out = ease(outroT / 1100)
  const espera = []

  const acto = $('acto')
  if (h.acto && enActo < pre) {
    if (acto.dataset.nn !== h.nn) {
      acto.dataset.nn = h.nn
      $('acton').textContent = h.acto.num; $('actoh').textContent = h.acto.titulo; $('actof').textContent = h.acto.frase
      encajar($('actoh'), 1320)
    }
    acto.style.opacity = ease(enActo / 450) * clamp((pre - enActo) / 450)
    $('actoh').style.transform = `translateY(${lerp(30, 0, ease(enActo / 700))}px)`
    $('actof').style.opacity = ease((enActo - 500) / 600)
  } else acto.style.opacity = 0

  // Entrada: el noticiario sobre el primer fotograma, que se acerca despacio.
  $('intro').style.opacity = clamp(1 - (t - D.intro + 500) / 500)
  $('introbg').style.transform = `scale(${1 + .06 * clamp(t / D.intro)})`
  const ti = ease(t / 700)
  $('introh').style.transform = `translateY(${lerp(40, 0, ti)}px)`; $('introh').style.opacity = ti
  $('introsub').style.opacity = ease((t - 350) / 600); $('introdatos').style.opacity = ease((t - 600) / 600)

  // La cabecera del número.
  $('fecha').textContent = h.fecha_larga
  const numeros = H.filter(x => !x.demo).length
  $('chip').textContent = h.demo ? tr('Edición en directo') : tr('Núm. {i} de {n}', { i: i + 1, n: numeros }) + (h.sha ? ` · ${h.sha}` : '')
  const r = $('rotulo'); if (r.dataset.nn !== h.nn) { r.dataset.nn = h.nn; r.textContent = h.rotulo; encajar(r, 1060) }
  const nota = $('nota').firstChild
  if (nota.dataset.nn !== h.nn) { nota.dataset.nn = h.nn; nota.textContent = h.nota || '' }
  const kr = ease(local / 450)
  r.style.opacity = kr * (1 - out); r.style.transform = `translateY(${lerp(14, 0, kr)}px)`
  nota.style.opacity = ease((local - 400) / 500)

  // El golpe de sello: entra grande y cae sobre el papel.
  const [d, m, y] = h.fecha_corta.split(' ')
  $('sello-dia').textContent = `${d} ${m}`; $('sello-ano').textContent = y
  $('sello-num').textContent = h.demo ? tr('EN DIRECTO') : tr('NÚM. {i}', { i: i + 1 }) + (h.sha ? ` · ${h.sha}` : '')
  const ks = clamp((local - 250) / 220), sello = $('sello')
  sello.style.opacity = ks * (1 - ease(outroT / 600))
  sello.style.transform = `rotate(${giro(i)}deg) scale(${lerp(1.6, 1, ease(ks))})`

  // El clip de la escena, con un fundido corto desde el último fotograma de la anterior.
  $('url').textContent = `${tr('Foto')} · ${h.barra || D.barra}`
  const ext = $('ext'), esExt = h.tipo === 'extraccion', deExt = prev && prev.tipo === 'extraccion'
  if (esExt) {
    extraccion(h, local)
    ext.style.display = 'block'; ext.style.opacity = prev && prev.fotogramas ? k : 1
    if (prev && prev.fotogramas && local < TRANS) espera.push(poner($('a'), fotograma(prev, prev.fotogramas - 1)))
    $('a').style.opacity = prev && prev.fotogramas && local < TRANS ? 1 : 0; $('b').style.opacity = 0
  } else {
    const f = Math.floor(local * D.fps_clip / 1000)
    espera.push(poner($('b'), fotograma(h, f)))
    const conA = prev && prev.fotogramas && local < TRANS
    if (conA) espera.push(poner($('a'), fotograma(prev, prev.fotogramas - 1)))
    $('b').style.opacity = prev ? k : 1
    $('a').style.opacity = conA ? 1 : 0
    if (deExt && local < TRANS) { extraccion(prev, prev.dur); ext.style.display = 'block'; ext.style.opacity = 1 - k }
    else ext.style.display = 'none'
  }

  // El antetítulo: lo que entra nuevo o lo que cambia.
  const ante = $('antetitulo'), nuevo = h.nuevas.length > 0, lista = nuevo ? h.nuevas : h.cambiadas
  ante.className = nuevo ? '' : 'cambia'
  ante.querySelector('b').textContent = tr(nuevo ? 'Nuevo' : 'Cambia')
  ante.querySelector('em').textContent = lista.slice(0, 4).join(' · ') + (lista.length > 4 ? ` +${lista.length - 4}` : '')
  ante.style.display = lista.length && i > 0 && !esExt ? 'flex' : 'none'
  ante.style.opacity = ease((local - 150) / 400) * (1 - out)

  // La hemeroteca: de la rejilla de la escena anterior a esta; lo nuevo entra con su recuadro en rojo.
  // Solo las fichas del repositorio de esta escena: al mudarse, la hemeroteca vuelve a empezar.
  const delCap = (key, j) => Number(key.split(':')[0]) === H[Math.max(0, j)].capitulo
  const visible = ORDER.filter(key => FIRST[key] <= i && delCap(key, i))
  const before = ORDER.filter(key => FIRST[key] <= i - 1 && delCap(key, i - 1) && delCap(key, i))
  const W = lerp(MOS.w, 1792, out), Hh = lerp(MOS.h, 990, out)
  const mosaic = $('mosaic')
  mosaic.style.left = `${lerp(MOS.x, 64, out)}px`; mosaic.style.top = `${lerp(MOS.y, 45, out)}px`
  mosaic.style.width = `${W}px`; mosaic.style.height = `${Hh}px`
  mosaic.style.transform = outroT > 0 ? `scale(${1 + .03 * clamp(outroT / D.outro)})` : ''
  const now = grid(visible.length, W, Hh), then = grid(before.length, MOS.w, MOS.h)
  const cambian = new Set(h.cambiadas)
  for (const el of mosaic.children) {
    const key = el.dataset.key, j = visible.indexOf(key)
    if (j < 0) { el.style.display = 'none'; continue }
    el.style.display = 'block'
    const isNew = FIRST[key] === i && outroT <= 0
    const to = now[j], from = isNew ? to : (then[before.indexOf(key)] ?? to)
    const kk = outroT > 0 ? 1 : k
    const x = lerp(from.x, to.x, kk), y = lerp(from.y, to.y, kk), w = lerp(from.w, to.w, kk), hh = lerp(from.h, to.h, kk)
    el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.width = `${w}px`; el.style.height = `${hh}px`
    el.style.transform = `scale(${isNew ? lerp(.55, 1, ease(local / 600)) : 1})`
    el.style.opacity = isNew ? ease(local / 400) : 1
    const tile = LATEST[i][key]
    const marca = outroT > 0 ? 0 : (isNew ? clamp(1 - (local - 900) / 1400) : cambian.has(tile.nombre) ? clamp(1 - (local - 500) / 1200) : 0)
    const color = isNew ? '179,48,28' : '25,22,18'
    el.style.boxShadow = marca ? `0 0 0 ${isNew ? 3 : 2}px rgba(${color},${marca})` : 'none'
    const [dk, lt] = el.querySelectorAll('img')
    const sc = tile.cubre ? Math.max(w / tile.w, hh / tile.h) : Math.min((w - 10) / tile.w, (hh - 24) / tile.h, 2)
    for (const im of [dk, lt]) { im.style.width = `${tile.w * sc}px`; im.style.height = `${tile.h * sc}px` }
    if (dk.dataset.src !== (tile.light || tile.dark)) { dk.src = tile.light || tile.dark; dk.dataset.src = dk.src }
    const oscura = tile.dark || tile.light
    if (lt.dataset.src !== oscura) { lt.src = oscura; lt.dataset.src = oscura }
    // En el cierre, una ola de oscuro barre la rejilla de izquierda a derecha, camino de la sala.
    const wave = clamp((outroT - 1500 - (x / Math.max(W, 1)) * 1100) / 450)
    lt.style.opacity = wave; el.style.background = wave > .5 ? 'var(--sala)' : 'var(--papel-2)'
  }

  // Cierre: la portada se aparta, la hemeroteca ocupa la página y entra la última edición.
  const browser = $('browser')
  browser.style.opacity = 1 - out; browser.style.transform = `scale(${lerp(1, .92, out)})`
  for (const id of ['lado', 'cabecera', 'pie']) $(id).style.opacity = 1 - out
  const ko = ease((outroT - 1900) / 600)
  $('outro').style.opacity = ko
  $('outroh').style.transform = `translateY(${lerp(30, 0, ko)}px)`
  $('fin').style.opacity = ease((outroT - 3200) / 700)

  for (const el of document.querySelectorAll('.cifra .n')) {
    const key = el.dataset.k, v0 = prev ? prev.cifras[key] : 0, v1 = h.cifras[key]
    el.textContent = num(lerp(v0 ?? 0, v1 ?? 0, ease(local / 900)))
  }
  $('tl').querySelector('.fill').style.width = `${clamp(t / FIN) * 100}%`
  document.querySelectorAll('#tl .dot').forEach((d, j) => d.classList.toggle('on', t >= H[j].inicio + H[j].dur - 1))
  return Promise.all(espera.filter(Boolean))
}

/** La escena de extracción: los ficheros vuelan del repositorio viejo al nuevo y las líneas del nuevo suben. */
const EXT = {}
function extraccion (h, t) {
  const ext = $('ext')
  if (ext.dataset.nn !== h.nn) {
    ext.dataset.nn = h.nn
    const carpetas = h.carpetas.map(([c, n]) => `<li data-c="${esc(c)}"><span>${esc(c)}/</span><span>${n}</span></li>`).join('')
    const lineas = !(D.ocultar || []).includes('lineas')
    ext.innerHTML = `
      <div class="repo" style="left:60px"><h3>${esc(h.de)}</h3><div class="n">${num(lineas ? h.lineas_a : h.ficheros_a)}</div><div class="l">${tr(lineas ? 'líneas' : 'ficheros')}</div>
        <ul>${carpetas}</ul></div>
      <div class="flecha"></div>
      <div class="repo" style="left:800px"><h3>${esc(h.a)}</h3><div class="n" id="extn">0</div><div class="l">${tr(lineas ? 'líneas al llegar' : 'ficheros al llegar')}</div>
        <ul id="extl"></ul></div>
      <div class="pie"></div><div class="dato"></div>` + h.muestra.map((m, j) => `<div class="vuela" data-j="${j}">${esc(m.split('/').slice(-2).join('/'))}</div>`).join('')
    EXT[h.nn] = { vuelos: [...ext.querySelectorAll('.vuela')], llegados: [] }
  }
  const e = EXT[h.nn], total = h.muestra.length, ini = 700, fin = h.dur - 1600, vuelo = 1000
  const salidas = h.muestra.map((_, j) => ini + (fin - ini - vuelo) * j / Math.max(1, total - 1))
  let llegados = 0
  e.vuelos.forEach((el, j) => {
    const k = clamp((t - salidas[j]) / vuelo), kk = ease(k)
    const y0 = 240 + (j % 9) * 40, y1 = 240 + (j % 9) * 40
    el.style.left = `${lerp(100, 850, kk)}px`; el.style.top = `${lerp(y0, y1, kk) - Math.sin(kk * Math.PI) * 90}px`
    el.style.opacity = k <= 0 || k >= 1 ? 0 : Math.min(1, k * 6, (1 - k) * 6)
    if (k >= 1) llegados++
  })
  // Las carpetas de origen se marcan mientras salen sus ficheros.
  const volando = h.muestra.filter((m, j) => t > salidas[j] && t < salidas[j] + vuelo)
  ext.querySelectorAll('.repo li[data-c]').forEach(li => li.classList.toggle('va', volando.some(m => m.startsWith(li.dataset.c))))
  const kl = clamp((t - ini) / (fin - ini))
  const lineas = !(D.ocultar || []).includes('lineas')
  $('extn').textContent = num((lineas ? h.lineas_b : h.ficheros_b) * ease(kl))
  $('extl').innerHTML = h.muestra.slice(0, llegados).slice(-9).map(m => `<li class="va"><span>${esc(m.split('/').pop())}</span></li>`).join('')
  ext.querySelector('.pie').innerHTML = t > fin - 300
    ? tr('{a} de los {b} ficheros llegan idénticos', { a: `<b>${h.ficheros}</b>`, b: h.ficheros_b }) + (lineas ? ' · ' + tr('{n} líneas que ya existían', { n: `<b>${num(h.lineas_mudan)}</b>` }) : '')
    : (n => tr(n === 1 ? '{n} fichero…' : '{n} ficheros…', { n: num(n) }))(Math.round(h.ficheros * kl))
  ext.querySelector('.pie').style.opacity = ease((t - ini) / 500)
  // Sin líneas en el resto del vídeo, aquí quedan como un dato pequeño: cuánto se muda.
  const dato = ext.querySelector('.dato')
  dato.textContent = !lineas && h.lineas_mudan ? tr('{n} líneas extraídas', { n: num(h.lineas_mudan) }) : ''
  dato.style.opacity = ease((t - fin) / 500)
}

window.seek = seek
load().then(() => seek(0))
</script>
