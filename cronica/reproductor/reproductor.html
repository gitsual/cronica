<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crónica</title>
<style>
  :root {
    --bg: #0e1416; --panel: #172024; --line: #24343a; --ink: #eef3f4; --muted: #8fa3a9;
    --teal: #00b0bd; --teal-soft: rgba(0, 176, 189, .18);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(1200px 700px at 30% 0%, #16272c 0%, var(--bg) 60%); }
  #stage { position: absolute; inset: 0; }
  header { position: absolute; left: 64px; top: 44px; right: 64px; height: 120px; }
  #fecha { font-size: 22px; letter-spacing: .28em; color: var(--teal); font-weight: 700; }
  #pr { position: absolute; right: 0; top: 0; font: 600 20px/1 ui-monospace, "JetBrains Mono", monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; }
  #rotulo { margin-top: 14px; font-size: 52px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; max-width: 1500px; }
  #browser { position: absolute; left: 64px; top: 200px; width: 1120px; height: 668px; border-radius: 14px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  #browser .bar { height: 38px; background: #1c272b; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  #browser .bar i { width: 12px; height: 12px; border-radius: 50%; background: #34464c; }
  #browser .bar span { margin-left: 18px; font: 14px ui-monospace, monospace; color: var(--muted); }
  #shot { position: absolute; left: 0; top: 38px; width: 1120px; height: 630px; overflow: hidden; }
  #shot img { position: absolute; left: 0; top: 0; width: 1120px; height: 630px; transform-origin: 0 0; }
  #mosaic { position: absolute; left: 1224px; top: 200px; width: 632px; height: 668px; }
  .tile { position: absolute; border-radius: 10px; overflow: hidden; background: #232e33; border: 1px solid var(--line); }
  .tile img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); }
  .tile .light { opacity: 0; }
  .tile b { position: absolute; left: 8px; bottom: 6px; font-size: 11px; font-weight: 600; color: var(--muted);
    text-shadow: 0 1px 2px #000; }
  #cifras { position: absolute; left: 64px; right: 64px; top: 900px; display: flex; gap: 20px; }
  .cifra { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; }
  .cifra .n { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cifra .l { font-size: 15px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  #tl { position: absolute; left: 64px; right: 64px; top: 1032px; height: 4px; background: var(--line); border-radius: 2px; }
  #tl .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); border-radius: 2px; }
  #tl .dot { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--line); }
  #tl .dot.on { border-color: var(--teal); background: var(--teal); }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(14,20,22,.74); text-align: center; }
  .card h1 { font-size: 84px; letter-spacing: -.02em; }
  .card h1 em { font-style: normal; color: var(--teal); }
  .card p { margin-top: 22px; font-size: 30px; color: var(--muted); }
  .card .big { display: flex; gap: 56px; margin-top: 44px; }
  .card .big div { font-size: 22px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .card .big strong { display: block; font-size: 72px; color: var(--ink); letter-spacing: 0; }
</style>
</head>
<body>
<div id="stage">
  <header><div id="fecha"></div><div id="pr"></div><div id="rotulo"></div></header>
  <div id="browser"><div class="bar"><i></i><i></i><i></i><span id="url"></span></div>
    <div id="shot"><img id="a" alt=""><img id="b" alt=""></div></div>
  <div id="mosaic"></div>
  <div id="cifras"></div>
  <div id="tl"><div class="fill"></div></div>
  <div class="card" id="intro"><h1 id="introh"></h1><p id="introsub"></p></div>
  <div class="card" id="outro"><h1 id="outroh"></h1><p id="outrosub"></p><div class="big" id="outrobig"></div></div>
</div>
<script>
let INTRO = 3200, PER = 3600, OUTRO = 7000
const TRANS = 750
const MESES = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC']
let CIFRAS = []
const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const lerp = (a, b, k) => a + (b - a) * k
const fecha = f => { const [y, m, d] = f.split('-'); return `${Number(d)} ${MESES[m - 1]} ${y}` }
const num = n => Math.round(n).toLocaleString('es-ES')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
/** El título con la última palabra en el color de acento. */
const acento = t => { const p = String(t).trim().split(/(?<=[ _\-\/])/); const u = p.pop(); return esc(p.join('')) + `<em>${esc(u)}</em>` }
/** «Tres semanas», «Un mes», «2 años»… entre dos fechas AAAA-MM-DD. */
function lapso (a, b) {
  const dias = Math.max(1, Math.round((new Date(b) - new Date(a)) / 864e5))
  const pal = ['', 'Un', 'Dos', 'Tres', 'Cuatro', 'Cinco', 'Seis', 'Siete', 'Ocho', 'Nueve', 'Diez', 'Once', 'Doce']
  const di = (n, s, p, fem) => (n <= 12 ? (n === 1 && fem ? 'Una' : pal[n]) : String(n)) + ' ' + (n === 1 ? s : p)
  if (dias < 14) return di(dias, 'día', 'días')
  if (dias < 60) return di(Math.round(dias / 7), 'semana', 'semanas', true)
  if (dias < 730) return di(Math.round(dias / 30.4), 'mes', 'meses')
  return di(Math.round(dias / 365), 'año', 'años')
}

let H = [], ORDER = [], FIRST = {}, LATEST = []
window.duration = 0

async function load () {
  const D = await (await fetch('datos.json')).json()
  H = D.hitos; CIFRAS = D.cifras; INTRO = D.intro; PER = D.por_hito; OUTRO = D.outro
  // Cada ficha entra en el primer hito que la tiene y se ve con su foto más reciente.
  H.forEach((h, i) => h.fichas.forEach(t => { if (!(t.key in FIRST)) { FIRST[t.key] = i; ORDER.push(t.key) } }))
  LATEST = H.map((h, i) => { const m = i ? { ...LATEST[i - 1] } : {}; h.fichas.forEach(t => { m[t.key] = t }); return m })
  window.duration = INTRO + H.length * PER + OUTRO
  const srcs = new Set(H.flatMap(h => [h.principal, ...h.fichas.flatMap(t => [t.light, t.dark].filter(Boolean))]))
  await Promise.all([...srcs].map(src => new Promise(ok => { const im = new Image(); im.onload = im.onerror = ok; im.src = src })))
  const mosaic = $('mosaic')
  for (const key of ORDER) {
    const el = document.createElement('div'); el.className = 'tile'; el.dataset.key = key
    el.innerHTML = '<img class="dark" alt=""><img class="light" alt=""><b></b>'
    el.querySelector('b').textContent = LATEST.at(-1)[key]?.nombre ?? key.split('/').pop()
    mosaic.appendChild(el)
  }
  const tl = $('tl')
  H.forEach((h, i) => { const d = document.createElement('div'); d.className = 'dot'; d.style.left = `${(i + 1) / H.length * 100}%`; tl.appendChild(d) })
  $('cifras').innerHTML = CIFRAS.map(([k, l]) => `<div class="cifra"><div class="n" data-k="${k}">0</div><div class="l">${l}</div></div>`).join('')
  const last = H.at(-1), rango = `${fecha(H[0].fecha)} → ${fecha(last.fecha)}`
  $('url').textContent = D.barra
  $('introh').innerHTML = acento(D.titulo)
  $('introsub').textContent = `${rango} · ${H.length} hitos`
  $('outroh').innerHTML = `${lapso(H[0].fecha, last.fecha)} de ${acento(D.proyecto).replace(/^(.*)<em>/, '<em>$1')}`
  $('outrosub').textContent = D.cierre ? `${D.cierre} · ${rango}` : rango
  $('outrobig').innerHTML = CIFRAS.filter(([k]) => last.cifras[k]).map(([k, l]) => `<div><strong>${num(last.cifras[k])}</strong>${l}</div>`).join('')
  for (const el of document.querySelectorAll('.card h1')) encajar(el, 1792)
  window.ready = true
}

/** Reduce la letra hasta que el texto quepa en `ancho`. */
function encajar (el, ancho) {
  el.style.fontSize = ''
  let px = parseFloat(getComputedStyle(el).fontSize)
  while (el.scrollWidth > ancho && px > 20) { px -= 2; el.style.fontSize = `${px}px` }
}

/** Rejilla para n fichas en el panel: columnas que mejor llenan el hueco. */
function grid (n, W, Hh, gap = 10) {
  if (!n) return []
  let best = null
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols)
    const w = (W - gap * (cols - 1)) / cols, h = (Hh - gap * (rows - 1)) / rows
    const size = Math.min(w, h * 1.5)
    if (!best || size > best.size) best = { cols, rows, w, h: Math.min(h, w / 1.1), size }
  }
  return Array.from({ length: n }, (_, j) => ({
    x: (j % best.cols) * (best.w + gap), y: Math.floor(j / best.cols) * (best.h + gap), w: best.w, h: best.h
  }))
}

function seek (t) {
  const N = H.length
  const intro = clamp(1 - (t - INTRO + 600) / 600)
  $('intro').style.opacity = intro
  let i = Math.floor((t - INTRO) / PER), local = (t - INTRO) - i * PER
  const outroT = t - INTRO - N * PER
  if (i < 0) { i = 0; local = 0 }
  if (i >= N) { i = N - 1; local = PER }
  const h = H[i], prev = H[i - 1]
  const k = ease(local / TRANS)

  $('fecha').textContent = fecha(h.fecha)
  $('pr').textContent = h.chip
  const r = $('rotulo'); if (r.textContent !== h.rotulo) { r.textContent = h.rotulo; encajar(r, 1500) }
  r.style.opacity = ease(local / 500); r.style.transform = `translateY(${lerp(18, 0, ease(local / 500))}px)`

  const a = $('a'), b = $('b')
  const pa = prev ? prev.principal : h.principal
  if (a.dataset.src !== pa) { a.src = pa; a.dataset.src = pa }
  if (b.dataset.src !== h.principal) { b.src = h.principal; b.dataset.src = h.principal }
  b.style.opacity = prev ? k : 1
  const zoom = 1 + .035 * clamp(local / PER)
  b.style.transform = `scale(${zoom})`; a.style.transform = `scale(${1.035})`

  // Fichas: de la rejilla del hito anterior a la de este; las nuevas crecen con un brillo.
  const visible = ORDER.filter(key => FIRST[key] <= i)
  const before = ORDER.filter(key => FIRST[key] <= i - 1)
  const outro = ease(outroT / 1400)
  const W = lerp(632, 1792, outro), Hh = lerp(668, 980, outro)
  const mosaic = $('mosaic')
  mosaic.style.left = `${lerp(1224, 64, outro)}px`; mosaic.style.top = `${lerp(200, 50, outro)}px`
  const now = grid(visible.length, W, Hh), then = grid(before.length, 632, 668)
  for (const el of mosaic.children) {
    const key = el.dataset.key, j = visible.indexOf(key)
    if (j < 0) { el.style.display = 'none'; continue }
    el.style.display = 'block'
    const isNew = FIRST[key] === i
    const to = now[j], from = isNew ? to : (then[before.indexOf(key)] ?? to)
    const kk = outroT > 0 ? 1 : k
    const x = lerp(from.x, to.x, kk), y = lerp(from.y, to.y, kk), w = lerp(from.w, to.w, kk), hh = lerp(from.h, to.h, kk)
    const s = isNew && outroT <= 0 ? lerp(.55, 1, ease(local / 600)) : 1
    el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.width = `${w}px`; el.style.height = `${hh}px`
    el.style.transform = `scale(${s})`; el.style.opacity = isNew && outroT <= 0 ? ease(local / 400) : 1
    const glow = isNew && outroT <= 0 ? clamp(1 - (local - 900) / 1400) : 0
    el.style.boxShadow = glow ? `0 0 0 2px rgba(0,176,189,${glow}), 0 0 28px rgba(0,176,189,${glow * .6})` : 'none'
    const tile = LATEST[i][key]
    const [dk, lt] = el.querySelectorAll('img')
    // Cabe entero en la ficha, sin crecer más del doble de su tamaño real.
    const sc = Math.min((w - 12) / tile.w, (hh - 28) / tile.h, 2)
    for (const im of [dk, lt]) { im.style.width = `${tile.w * sc}px`; im.style.height = `${tile.h * sc}px` }
    if (dk.dataset.src !== (tile.dark || tile.light)) { dk.src = tile.dark || tile.light; dk.dataset.src = dk.src }
    if (lt.dataset.src !== tile.light) { lt.src = tile.light; lt.dataset.src = tile.light }
    // En el cierre, una ola de claro barre la rejilla de izquierda a derecha.
    const wave = clamp((outroT - 2200 - (x / Math.max(W, 1)) * 1400) / 500)
    lt.style.opacity = wave; el.style.background = wave > .5 ? '#f0f1f2' : '#232e33'
  }
  $('browser').style.opacity = 1 - outro; $('cifras').style.opacity = 1 - outro; document.querySelector('header').style.opacity = 1 - outro
  $('outro').style.opacity = clamp((outroT - 3600) / 700)

  for (const el of document.querySelectorAll('.cifra .n')) {
    const key = el.dataset.k, v0 = prev ? prev.cifras[key] : 0, v1 = h.cifras[key]
    el.textContent = num(lerp(v0 ?? 0, v1 ?? 0, prev ? k : ease(local / 1200)))
  }
  $('tl').querySelector('.fill').style.width = `${clamp((i + clamp(local / PER)) / N) * 100}%`
  document.querySelectorAll('#tl .dot').forEach((d, j) => d.classList.toggle('on', j <= i))
}
window.seek = seek
load().then(() => seek(0))
</script>
</body>
</html>
