[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cronica"
version = "0.1.0"
description = "El vídeo de cómo evolucionó la interfaz de un proyecto, leyendo su historia git"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cronica = "cronica.cli:main"

[tool.setuptools]
packages = ["cronica"]

[tool.setuptools.package-data]
cronica = ["reproductor/*.html", "reproductor/fonts/*"]
